name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          # setup-python cannot install 3.9 on ubuntu-latest (24.04)
          - os: ubuntu-22.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install -e .
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: demo still runs
        run: python examples/demo.py

  self-check:
    name: blastr on its own diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: dogfood
        run: |
          git diff --name-only HEAD~1 > /dev/null 2>&1 || true
          git diff HEAD~1 -- . | blastr --diff - --no-color || true
